<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Couple Expense Tracker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fbcfe8,
                    #ddd6fe
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-container {

            width: 380px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .logo {

            font-size: 55px;

            margin-bottom: 10px;
        }

        h1 {

            color: #7c3aed;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #777;

            margin-bottom: 30px;
        }

        .input-group {

            text-align: left;

            margin-bottom: 20px;
        }

        .input-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }

        .input-group input {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        .input-group input:focus {

            border-color: #7c3aed;
        }

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #7c3aed;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {

            background: #6d28d9;
        }

        .error {

            background: #fee2e2;

            color: #dc2626;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;
        }

        .footer {

            margin-top: 25px;

            color: #999;

            font-size: 13px;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">
            💕
        </div>

        <h1>
            Our Expenses
        </h1>

        <p class="subtitle">
            Couple Expense Tracker
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <div class="footer">

            Your expenses, together ❤️

        </div>

    </div>

</body>

</html>
