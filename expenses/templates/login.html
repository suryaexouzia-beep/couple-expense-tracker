<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Our Expenses</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #7c3aed,
                #4c1d95
            );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.2);
        }

        .logo {
            text-align: center;

            margin-bottom: 25px;
        }

        .logo h1 {
            color: #4c1d95;
            margin-bottom: 5px;
        }

        .logo p {
            color: #777;
            font-size: 13px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #444;

            font-weight: bold;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #7c3aed;
        }

        button {
            width: 100%;

            padding: 13px;

            background: #6d28d9;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #4c1d95;
        }

        .error {
            background: #fee2e2;

            color: #dc2626;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">

        <h1>💕 Our Expenses</h1>

        <p>Couple Expense Tracker</p>

    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            🔐 Login
        </button>

    </form>

</div>

</body>

</html>
