<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Income</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f5fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            color: #4c1d95;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #6d28d9;
            text-decoration: none;
        }

        .messages {
            margin-bottom: 15px;
        }

        .message {
            padding: 10px;
            border-radius: 7px;
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>💰 Add Income</h2>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'add_income' %}">

    {% csrf_token %}

    <label>Amount</label>
    <input
        type="number"
        name="amount"
        step="0.01"
        min="0"
        required
    >

    <label>Description</label>
    <textarea
        name="description"
    ></textarea>

    <label>Date</label>
    <input
        type="date"
        name="date"
        required
    >

    <button type="submit">
        ➕ Add Income
    </button>

</form>
    <a
        href="{% url 'income' %}"
        class="back"
    >
        ← Back to Income
    </a>

</div>

</body>
</html>
